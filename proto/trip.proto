syntax = "proto3";

package  trip;

// “Where should I put the generated Go code, and what should the Go package name be?”
option go_package = "shared/proto/trip;trip";

service TripService{
    rpc PreviewTrip(PreviewTripRequest) returns (PreviewTripResponse);
}

message PreviewTripRequest{
    string userID = 1;
    Coordinate startLocation =2 ;
    Coordinate endLocation =3 ;
}

message PreviewTripResponse{
    string tripID = 1;
    Route route = 2; 
   repeated RideFare rideFares = 3 ;
}


message Coordinate{
    double latitude = 1;
    double longitude = 2;
}

message Geometry{
    repeated Coordinate coordinates = 1;
}

//repeated means it's going to be array of geometry
message Route{
    repeated Geometry geometry = 1; 
    double distance = 2;
    double duration = 3;
}

message RideFare{
    string id = 1;
    string userID = 2;
    string packageSlug = 3; 
    double TotalPriceInNpr  = 4;

}